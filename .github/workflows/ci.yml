name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
        working-directory: developer
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run check:source
      - run: npm run build:browser
      - run: sudo apt-get update -qq && sudo apt-get install -y tmux
      - run: node --test developer/tests/*.test.mts operations/study-refresh/*.test.mts operations/study-monitor/*.test.mts rust/compat/*.test.mts
      - run: python3 -m unittest discover -s ai -p 'test_*.py'
      - run: python3 -m compileall -q ai
      - run: node scripts/verify-mail-queue.mts
      - run: node --check deploy/server.mts && node --check developer/server.mts
      - run: python3 -m compileall -q deploy scripts careers
      - run: python3 -m unittest discover -s careers -p 'test_*.py'
      - run: node --check careers/public/app.js && node --check careers/public/theme.js && node --check careers/public/onboarding.js
      - run: python3 -m unittest discover -s operations/delivery -p 'test_*.py'
      - run: node scripts/check-publication.mts

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CARGO_BUILD_JOBS: 4
      PGPASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt,clippy && rustup default 1.100.0
      - run: cargo fmt --manifest-path rust/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path rust/Cargo.toml
      - name: Contest team deadline, concurrent allocator and least-privilege contracts
        run: cargo test --locked --manifest-path rust/Cargo.toml -p cbgpu-contest-teams --test postgres -- --ignored
      - name: Build static ingress binary
        env:
          CBGPU_SOURCE_SHA: ${{ github.sha }}
        run: |
          rustup target add x86_64-unknown-linux-musl
          export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER="$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/rust-lld"
          RUSTFLAGS='-C linker-flavor=ld.lld' cargo build --locked --release --target x86_64-unknown-linux-musl --manifest-path rust/Cargo.toml -p cbgpu-gateway
      - name: Isolated PostgreSQL contracts
        env:
          CBGPU_RUNTIME_DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/cbgpu_runtime_test
          CBGPU_TEST_DATABASE_URL: postgresql://cbgpu_runtime:ci-runtime-only@127.0.0.1:5432/cbgpu_runtime_test
          CBGPU_CAREERS_TEST_DATABASE_URL: postgresql://cbgpu_careers:ci-careers-only@127.0.0.1:5432/cbgpu_runtime_test
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE cbgpu_runtime LOGIN PASSWORD 'ci-runtime-only'; CREATE ROLE cbgpu_careers LOGIN NOINHERIT PASSWORD 'ci-careers-only';"
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE cbgpu_runtime_test;"
          cargo run --locked --manifest-path rust/Cargo.toml -p cbgpu-core -- migrate
          cargo test --locked --manifest-path rust/Cargo.toml --test postgres -- --ignored
          cargo test --locked --manifest-path rust/Cargo.toml --test careers_postgres -- --ignored
      - name: Isolated Rust Compose contracts
        env:
          CBGPU_COMPOSE_RUN_DOCKER_TEST: '1'
        run: cargo test --locked --manifest-path rust/Cargo.toml -p cbgpu-compose-worker --test docker_contract -- --ignored
