name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
        working-directory: developer
      - run: node scripts/verify-mail-queue.mjs
      - run: node --check deploy/server.mjs && node --check developer/server.mjs
      - run: python3 -m compileall -q deploy scripts careers
      - run: python3 -m unittest discover -s careers -p 'test_*.py'
      - run: node --check careers/public/app.js && node --check careers/public/theme.js && node --check careers/public/onboarding.js
      - run: python3 -m unittest discover -s operations/delivery -p 'test_*.py'
      - run: node scripts/check-publication.mjs
