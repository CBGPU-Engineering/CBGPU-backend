name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - run: rustup toolchain install 1.100.0 --profile minimal && rustup default 1.100.0
      - run: cargo install cargo-audit --locked --version 0.23.0
      - run: cargo audit --file rust/Cargo.lock
      - run: npm ci --ignore-scripts --no-audit --no-fund && npm audit
      - run: npm ci --ignore-scripts --no-audit --no-fund && npm audit
        working-directory: developer
      - run: npm ci --ignore-scripts --no-audit --no-fund && npm audit --audit-level=high
        working-directory: infra/cloud
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
        working-directory: developer
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run check:source
      - run: npm run build:browser
      - name: Poll transaction integrity (isolated disposable PostgreSQL)
        run: node --test tests/polls/*.test.mts
      - run: sudo apt-get update -qq && sudo apt-get install -y tmux
      - run: node --test developer/tests/*.test.mts operations/study-refresh/*.test.mts operations/study-monitor/*.test.mts operations/worker.test.mts rust/compat/*.test.mts
      # Native AI parity is verified in the Rust job below; no legacy interpreter.
      - run: node scripts/verify-mail-queue.mts
      - run: node --check deploy/server.mts && node --check developer/server.mts
      - run: node --check careers/public/app.js && node --check careers/public/theme.js && node --check careers/public/onboarding.js
      - run: node scripts/check-publication.mts

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CARGO_BUILD_JOBS: 4
      PGPASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt,clippy && rustup default 1.100.0
      - name: Native CPU model build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y cmake clang libclang-dev
      - name: Verify manifest-only SQLite compatibility patch
        run: node scripts/check-vendored-sqlite.mts
      - run: cargo fmt --manifest-path rust/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path rust/Cargo.toml
      - name: Reservation extension authorization and direct-booking races (disposable PostgreSQL)
        run: cargo test --locked --manifest-path rust/Cargo.toml -p cbgpu-gpu-enrollment --test reservation_extensions -- --ignored
      - name: School-local reservation authority and lifecycle (disposable PostgreSQL)
        run: cargo test --locked --manifest-path rust/Cargo.toml -p cbgpu-gpu-enrollment --test school_admin_reservations -- --ignored
      - name: Canonical public school directory and cached catalog drafts (disposable PostgreSQL)
        run: cargo test --locked --manifest-path rust/Cargo.toml -p cbgpu-schools --test school_directory_canonical -- --ignored
      - name: Middle-school catalog and participant cohort PostgreSQL boundaries
        run: cargo test --locked --manifest-path rust/Cargo.toml -p cbgpu-schools --test middle_schools -- --ignored
      - name: School club windows privacy and capacity race PostgreSQL
        run: cargo test --locked --manifest-path rust/Cargo.toml -p cbgpu-schools --test clubs -- --ignored
      - name: Arcade replay ownership and least-privilege PostgreSQL contracts
        run: |
          docker run --rm -d --name cbgpu-arcade-ci-db -e POSTGRES_PASSWORD=ci-only-password -e POSTGRES_DB=cbgpu_arcade_ci -p 127.0.0.1:55492:5432 postgres:17
          trap 'docker rm -f cbgpu-arcade-ci-db >/dev/null' EXIT
          for attempt in $(seq 1 30); do
            if docker exec cbgpu-arcade-ci-db pg_isready -h 127.0.0.1 -U postgres -d cbgpu_arcade_ci; then break; fi
            sleep 1
          done
          ARCADE_TEST_DATABASE_URL=postgresql://postgres:ci-only-password@127.0.0.1:55492/cbgpu_arcade_ci cargo test --locked --manifest-path rust/Cargo.toml -p cbgpu-arcade -- --ignored
      - name: Contest team deadline, concurrent allocator and least-privilege contracts
        run: cargo test --locked --manifest-path rust/Cargo.toml -p cbgpu-contest-teams --test postgres -- --ignored
      - name: Award voting concurrency and CPU diagnostic write permissions
        run: |
          cargo test --locked --manifest-path rust/Cargo.toml -p cbgpu-contest-teams --test awards_race -- --ignored
          cargo test --locked --manifest-path rust/Cargo.toml -p cbgpu-compose-worker --test cpu_diagnostics_pg -- --ignored
      - name: Native portal cookie, principal, revocation and read-only import contracts
        run: |
          docker pull postgres:17-alpine
          cargo test --locked --manifest-path rust/Cargo.toml -p cbgpu-portal-auth --test postgres -- --ignored
      - name: Official ad report transaction, privacy and experiment contracts
        run: cargo test --locked --manifest-path rust/Cargo.toml -p cbgpu-ad-revenue --test postgres -- --ignored
      - name: Build static ingress binary
        env:
          CBGPU_SOURCE_SHA: ${{ github.sha }}
        run: |
          rustup target add x86_64-unknown-linux-musl
          export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER="$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/rust-lld"
          RUSTFLAGS='-C linker-flavor=ld.lld' cargo build --locked --release --target x86_64-unknown-linux-musl --manifest-path rust/Cargo.toml -p cbgpu-gateway -p cbgpu-ai-documents
      - name: Offline native PDF and image OCR contracts
        env:
          CBGPU_OCR_TEST_IMAGE: cbgpu-ocr:ci-native
        run: |
          ocr_context=$(mktemp -d)
          cp ai/ocr/Dockerfile "$ocr_context/Dockerfile"
          cp rust/target/x86_64-unknown-linux-musl/release/cbgpu-ai-documents "$ocr_context/cbgpu-ai-documents"
          docker build -t "$CBGPU_OCR_TEST_IMAGE" "$ocr_context"
          cargo test --locked --manifest-path rust/Cargo.toml -p cbgpu-ai-documents --test container -- --ignored
      - name: Isolated PostgreSQL contracts
        env:
          CBGPU_RUNTIME_DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/cbgpu_runtime_test
          CBGPU_TEST_DATABASE_URL: postgresql://cbgpu_runtime:ci-runtime-only@127.0.0.1:5432/cbgpu_runtime_test
          CBGPU_CAREERS_TEST_DATABASE_URL: postgresql://cbgpu_careers:ci-careers-only@127.0.0.1:5432/cbgpu_runtime_test
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE cbgpu_runtime LOGIN PASSWORD 'ci-runtime-only'; CREATE ROLE cbgpu_careers LOGIN NOINHERIT PASSWORD 'ci-careers-only';"
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE cbgpu_runtime_test;"
          cargo run --locked --manifest-path rust/Cargo.toml -p cbgpu-core -- migrate
          cargo test --locked --manifest-path rust/Cargo.toml -p cbgpu-core --test postgres -- --ignored
          cargo test --locked --manifest-path rust/Cargo.toml -p cbgpu-careers --test careers_postgres -- --ignored
      - name: Isolated Rust Compose contracts
        env:
          CBGPU_COMPOSE_RUN_DOCKER_TEST: '1'
        run: cargo test --locked --manifest-path rust/Cargo.toml -p cbgpu-compose-worker --test docker_contract -- --ignored
      - name: Native model preparation and notebook bridge retirement contracts
        run: |
          cargo test --locked --manifest-path rust/Cargo.toml -p cbgpu-ai --test model_assets --test native_resources
          cargo test --locked --manifest-path rust/Cargo.toml -p cbgpu-gpu-gateway --test public_start
          offline_model_plan=$(mktemp -d)
          cargo run --locked --manifest-path rust/Cargo.toml -p cbgpu-ai --bin cbgpu-ai-prepare-models -- ai/models.json "$offline_model_plan/models"
          test ! -e "$offline_model_plan/models"
          cargo run --locked --manifest-path rust/Cargo.toml -p cbgpu-gpu-gateway --bin cbgpu-gpu-public-start -- --help
      - name: Isolated native AI storage, API and scheduler contracts
        run: |
          for database in cbgpu_ai_store_test cbgpu_ai_api_test cbgpu_ai_scheduler_test cbgpu_ai_handoff_test; do
            createdb -h 127.0.0.1 -U postgres "$database"
          done
          CBGPU_AI_TEST_DATABASE_URL=postgresql://postgres:ci-only-password@127.0.0.1:5432/cbgpu_ai_store_test cargo test --locked --manifest-path rust/Cargo.toml -p cbgpu-ai-store --test postgres -- --ignored
          CBGPU_AI_TEST_DATABASE_URL=postgresql://postgres:ci-only-password@127.0.0.1:5432/cbgpu_ai_api_test cargo test --locked --manifest-path rust/Cargo.toml -p cbgpu-ai --test http -- --ignored
          CBGPU_AI_TEST_DATABASE_URL=postgresql://postgres:ci-only-password@127.0.0.1:5432/cbgpu_ai_scheduler_test cargo test --locked --manifest-path rust/Cargo.toml -p cbgpu-ai --test scheduler_postgres -- --ignored
          CBGPU_AI_TEST_DATABASE_URL=postgresql://postgres:ci-only-password@127.0.0.1:5432/cbgpu_ai_handoff_test cargo test --locked --manifest-path rust/Cargo.toml -p cbgpu-ai-handoff --lib -- --ignored
      - name: Isolated native robotics ownership, missions and map contracts
        run: cargo test --locked --manifest-path rust/Cargo.toml -p cbgpu-robotics --test postgres -- --ignored
      - name: External contest API session revocation and original application rules
        run: |
          createdb -h 127.0.0.1 -U postgres cbgpu_contests_api_test
          CBGPU_CONTEST_REPO="$PWD" CBGPU_CONTEST_TEST_DATABASE_URL=postgresql://postgres:ci-only-password@127.0.0.1:5432/cbgpu_contests_api_test cargo test --locked --manifest-path rust/Cargo.toml -p cbgpu-contests-api --test postgres -- --ignored
