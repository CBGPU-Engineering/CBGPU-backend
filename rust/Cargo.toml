[workspace]
members = ["crates/cbgpu-core", "crates/cbgpu-gateway", "crates/cbgpu-front-worker", "crates/cbgpu-cutover", "crates/cbgpu-careers", "crates/cbgpu-compose-worker", "crates/cbgpu-contest-teams", "crates/cbgpu-backup"]
exclude = ["crates/cbgpu-accounts", "crates/cbgpu-ops", "crates/cbgpu-delivery", "crates/cbgpu-domains"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
