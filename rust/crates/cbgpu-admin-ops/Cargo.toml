[package]
name = "cbgpu-admin-ops"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"

[dependencies]
cbgpu-delivery = { path = "../cbgpu-delivery" }
cbgpu-front-worker = { path = "../cbgpu-front-worker" }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
base64 = "0.22"
hmac = "0.12"
sha2 = { version = "0.10", features = ["oid"] }
rsa = { version = "=0.10.0", features = ["pkcs1v15"] }
sha2-rsa = { package = "sha2", version = "0.11", features = ["oid"] }
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
tempfile = "3"
