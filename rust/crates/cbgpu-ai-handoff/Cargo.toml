[package]
name = "cbgpu-ai-handoff"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"
[dependencies]
cbgpu-ai-store = { path = "../cbgpu-ai-store" }
cbgpu-robotics = { path = "../cbgpu-robotics" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "net"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "sqlite"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
[dev-dependencies]
tempfile = "3"
