[package]
name="cbgpu-schools"
version="0.1.0"
edition="2024"
license="Apache-2.0"
rust-version="1.88"
[dependencies]
axum="0.8"
tokio={version="1",features=["macros","rt-multi-thread","net","signal"]}
serde={version="1",features=["derive"]}
serde_json="1"
url="2"
csv="1"
encoding_rs="0.8"
sha2="0.10"
uuid={version="1",features=["v4"]}
sqlx={version="0.9",default-features=false,features=["runtime-tokio", "tls-rustls-ring","postgres","json","uuid"]}
reqwest={version="0.12",default-features=false,features=["json","rustls-tls"]}
[dev-dependencies]
tower={version="0.5",features=["util"]}
http-body-util="0.1"
