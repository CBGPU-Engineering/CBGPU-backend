[package]
name = "cbgpu-node-setup"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94"

[workspace]

[dependencies]
axum = "0.8.8"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "net", "process", "signal", "time", "sync", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
sha2 = "0.10"
rand = "0.9"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
strip = true
lto = "thin"
