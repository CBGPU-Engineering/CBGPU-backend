[package]
name = "cbgpu-gpu-gateway"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"
[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "io-util", "sync", "process"] }
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
futures-util = "0.3"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
percent-encoding = "2"
base64 = "0.22"
async-trait = "0.1"
uuid = "1"
cbgpu-edge-policy = { path = "../cbgpu-edge-policy" }
[dev-dependencies]
tokio-tungstenite = "0.28"
