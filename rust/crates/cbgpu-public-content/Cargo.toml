[package]
name="cbgpu-public-content"
version="0.1.0"
edition="2024"
license="Apache-2.0"
rust-version="1.88"
[dependencies]
axum="0.8"
tokio={version="1",features=["macros","rt-multi-thread","net","signal"]}
serde_json="1"
futures-util="0.3"
reqwest={version="0.12",default-features=false,features=["json","rustls-tls","stream"]}
url="2"
uuid="1"
[dev-dependencies]
tower={version="0.5",features=["util"]}
http-body-util="0.1"
[dependencies.sqlx]
version="0.9"
default-features=false
features=["runtime-tokio", "tls-rustls-ring","postgres","json","uuid"]
