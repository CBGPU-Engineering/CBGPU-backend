[package]
name = "cbgpu-gpu-enrollment"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "io-util", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ed25519-dalek = "2"
sha2 = "0.10"
getrandom = "0.3"
fs2 = "0.4"
libc = "0.2"
url = "2"
cbgpu-notebook-protocol = { path = "../cbgpu-notebook-protocol" }
bytes = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "chrono", "uuid", "json"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
hyper = {version="1",features=["client","http1"]}
hyper-util = {version="0.1",features=["tokio"]}
http-body-util = "0.1"
futures-util = {version="0.3",features=["sink"]}
tokio-tungstenite = { version="0.28",default-features=false,features=["connect","rustls-tls-webpki-roots"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-rustls = {version="0.26", default-features=false, features=["ring","tls12"]}
rcgen = {version="0.13",default-features=false,features=["ring","pem"]}
