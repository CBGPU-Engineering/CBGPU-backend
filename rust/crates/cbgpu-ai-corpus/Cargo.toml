[package]
name = "cbgpu-ai-corpus"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"
[features]
default = []
e5 = ["dep:cbgpu-ai-models"]
[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "json", "uuid"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "=0.41.1", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
cbgpu-ai-models = { path = "../cbgpu-ai-models", optional = true }
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }
