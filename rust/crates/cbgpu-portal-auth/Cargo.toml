[package]
name="cbgpu-portal-auth"
version="0.1.0"
edition="2024"
rust-version="1.88"
license="Apache-2.0"
[dependencies]
cbgpu-deploy-control={path="../cbgpu-deploy-control"}
axum="0.8"
tokio={version="1",features=["macros","rt-multi-thread","net","signal","sync","time"]}
serde={version="1",features=["derive"]}
serde_json="1"
base64="0.22"
hmac="0.12"
sha2="0.10"
subtle="2"
rand="0.8"
uuid={version="1",features=["serde"]}
reqwest={version="0.12",default-features=false,features=["json","rustls-tls"]}
sqlx={version="0.8",default-features=false,features=["runtime-tokio-rustls","postgres","uuid","json"]}
rusqlite={version="0.32",features=["bundled"]}
url="2"
[dev-dependencies]
tempfile="3"
tower={version="0.5",features=["util"]}
tokio={version="1",features=["test-util"]}
