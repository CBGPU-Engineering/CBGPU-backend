[package]
name = "cbgpu-private-app-gateway"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
base64 = "0.22"
subtle = "2"
url = "2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
futures-util = "0.3"
cbgpu-edge-policy = { path = "../cbgpu-edge-policy" }
